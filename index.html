<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Steps & Gym">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Steps and Gym</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;color:#171717;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0}.app{max-width:540px;min-height:100dvh;margin:auto;background:#fff;padding:20px 18px 90px}
    h1{font-size:24px;margin:8px 0 18px}h2{font-size:19px;margin:0 0 12px}
    .muted{color:#667085;font-size:14px}.card{background:#f7f8fa;border-radius:16px;padding:16px;margin:12px 0}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}
    button,input,select{font:inherit}button{border:0;border-radius:11px;padding:11px 14px;background:#3b82f6;color:white;font-weight:650;cursor:pointer}
    button.secondary{background:#eaf1ff;color:#2459b5}button.gray{background:#e9ebef;color:#333}button.danger{background:#fff0f0;color:#b42318}
    button:disabled{opacity:.45;cursor:not-allowed}input,select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}
    label{font-size:13px;color:#475467;display:grid;gap:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .tabs{position:fixed;bottom:0;left:0;right:0;max-width:540px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#ffffffed;border-top:1px solid #e5e7eb;backdrop-filter:blur(12px)}
    .tab{background:transparent;color:#667085;padding:8px 2px;font-size:12px}.tab.active{color:#2563eb}
    .progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0}.progress>i{display:block;height:100%;background:#16a765;border-radius:99px}
    .big{font-size:36px;font-weight:750}.check{width:22px;height:22px;accent-color:#16a765}
    .task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eaecf0}.task:last-child{border:0}
    .notice{padding:12px;border-radius:12px;background:#fff7e6;color:#8a5a00;margin:10px 0}
    .success{background:#eaf8f0;color:#087443}.pill{display:inline-block;padding:5px 9px;background:#eaf1ff;color:#2459b5;border-radius:99px;font-size:12px}
    canvas{width:100%;height:190px}.hidden{display:none}.spacer{height:6px}
  </style>
</head>
<body>
  <main class="app">
    <div id="view"></div>
  </main>
  <nav class="tabs" id="tabs"></nav>

<script>
const KEY="steps-gym-v1";
const today=()=>new Date().toLocaleDateString("en-CA");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
  goal:8000,steps:{},height:"",weight:"",reminder:"20:00",notify:false,lang:"zh",
  custom:[],done:{},checkins:{}
};
let page="today", sensorOn=false, lastPeak=0;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function t(zh,en){return data.lang==="zh"?zh:en}
function count(){return Number(data.steps[today()]?.count||0)}
function bmi(){let h=Number(data.height)/100,w=Number(data.weight);return h>0&&w>0?w/(h*h):0}
function band(){let b=bmi();return !b?"":b<18.5?"thin":b<24?"normal":"high"}
function tasks(){
  let type=band(), base=type==="thin"
    ? [["力量训练","Strength training","力量", "15 分钟","15 min"],["深蹲","Squats","力量","3 组","3 sets"],["核心训练","Core workout","核心","10 分钟","10 min"]]
    : type==="high"
    ? [["快走","Brisk walk","有氧","20 分钟","20 min"],["原地踏步","Marching","有氧","10 分钟","10 min"],["拉伸","Stretching","核心","8 分钟","8 min"]]
    : [["快走","Brisk walk","有氧","15 分钟","15 min"],["深蹲","Squats","力量","3 组","3 sets"],["平板支撑","Plank","核心","3 组","3 sets"]];
  let list=base.map((x,i)=>({id:"base"+i,name:data.lang==="zh"?x[0]:x[1],meta:data.lang==="zh"?x[3]:x[4]}));
  return list.concat(data.custom.map(x=>({id:x.id,name:x.name,meta:x.meta||""})));
}
function doneList(){return data.done[today()]||[]}
function maybeCelebrate(){
  let r=data.steps[today()]||{count:0,celebrated:false};
  if(r.count>=Number(data.goal)&&!r.celebrated){
    r.celebrated=true;data.steps[today()]=r;save();
    alert(t("太棒了！你已经达到今日步数目标！","Great job! You reached today's step goal!"));
    if(data.notify&&"Notification"in window&&Notification.permission==="granted")
      new Notification("Steps and Gym",{body:t("今日步数目标已达成！","Daily step goal reached!")});
  }
}
function checkReminder(){
  let now=new Date(), hhmm=now.toTimeString().slice(0,5);
  if(hhmm>=data.reminder&&count()<Number(data.goal)&&localStorage.getItem("reminded-"+today())!=="1"){
    localStorage.setItem("reminded-"+today(),"1");
    setTimeout(()=>alert(t(`今天还差 ${Math.max(0,data.goal-count())} 步，一起走一走吧！`,`Only ${Math.max(0,data.goal-count())} steps to go today. Take a walk!`)),300);
  }
}
const navItems=[["today","今日","Today"],["gym","健身","Gym"],["stats","统计","Stats"],["profile","我的","Profile"]];
function render(){
  $("#tabs").innerHTML=navItems.map(([id,zh,en])=>`<button class="tab ${page===id?"active":""}" data-page="${id}">${t(zh,en)}</button>`).join("");
  let v=$("#view");
  if(page==="today"){
    let n=count(),goal=Number(data.goal)||8000,p=Math.min(100,Math.round(n/goal*100));
    v.innerHTML=`<h1>${t("今日步数","Today's steps")}</h1>
      <section class="card">
        <div class="row"><span class="muted">${t("今日进度","Daily progress")}</span><span class="pill">${p}%</span></div>
        <div class="big">${n.toLocaleString()} <span class="muted">/ ${goal.toLocaleString()}</span></div>
        <div class="progress"><i style="width:${p}%"></i></div>
        <div class="row"><button id="sensor">${sensorOn?t("结束计步","Stop counting"):t("开始计步","Start counting")}</button><button class="secondary" id="manual">＋ ${t("手动录入","Enter steps")}</button></div>
      </section>
      ${n>=goal?`<div class="notice success">${t("目标达成，做得很好！","Goal reached. Well done!")}</div>`:""}
      <section class="card"><div class="row"><h2>${t("今日健身任务","Today's workout")}</h2><button class="secondary" data-page="gym">${t("查看","Open")}</button></div>
      <div class="muted">${doneList().length}/${tasks().length} ${t("项已完成","completed")}</div></section>
      <p class="muted">${t("提示：前台计步依赖设备传感器，结果仅供参考。","Note: foreground step counting relies on device sensors and is an estimate.")}</p>`;
  } else if(page==="gym"){
    let list=tasks(),done=doneList();
    v.innerHTML=`<h1>${t("健身任务","Workout")}</h1>
      <section class="card"><div class="row"><div><h2>${t("今日任务","Today's tasks")}</h2><div class="muted">${bmi()?`BMI ${bmi().toFixed(1)} · ${band()==="thin"?t("偏瘦档","Lower range"):band()==="high"?t("偏胖档","Higher range"):t("标准档","Standard range")}`:t("填写身高体重以匹配任务","Add height and weight to personalize tasks")}</div></div><span class="pill">${done.length}/${list.length}</span></div>
      ${list.map(x=>`<label class="task"><input class="check" type="checkbox" data-task="${esc(x.id)}" ${done.includes(x.id)?"checked":""}><span style="flex:1"><b>${esc(x.name)}</b><div class="muted">${esc(x.meta)}</div></span></label>`).join("")}
      <button id="checkin" ${list.length!==done.length||data.checkins[today()]?"disabled":""}>${data.checkins[today()]?t("今日已打卡","Checked in today"):t("今日打卡完成","Complete today's check-in")}</button>
      </section>
      <section class="card"><h2>${t("新建个人任务","Add a custom task")}</h2><div class="grid2"><label>${t("任务名称","Task name")}<input id="taskName" maxlength="40" placeholder="${t("例如：骑车","e.g. Cycling")}"></label><label>${t("时长/数量","Duration / amount")}<input id="taskMeta" maxlength="30" placeholder="${t("例如：20 分钟","e.g. 20 min")}"></label></div><div class="spacer"></div><button id="addTask">${t("添加任务","Add task")}</button>
      ${data.custom.length?`<div class="spacer"></div>${data.custom.map(x=>`<div class="row task"><span>${esc(x.name)}</span><button class="danger" data-delete="${esc(x.id)}">${t("删除","Delete")}</button></div>`).join("")}`:""}
      </section>`;
  } else if(page==="stats"){
    let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d.toLocaleDateString("en-CA")});
    let vals=days.map(d=>Number(data.steps[d]?.count||0));
    let completed=days.filter(d=>!!4815860562-0
data.checkins[d]).length;
    let streak=0;for(let i=0;i<365;i++){let d=new Date();d.setDate(d.getDate()-i);if(data.checkins[d.toLocaleDateString("en-CA")])streak++;else break}
    let thisWeek=vals.reduce((a,b)=>a+b,0), prev=0;
    for(let i=7;i<14;i++){let d=new Date();d.setDate(d.getDate()-i);prev+=Number(data.steps[d.toLocaleDateString("en-CA")]?.count||0)}
    let diff=thisWeek-prev;
    v.innerHTML=`<h1>${t("统计","Statistics")}</h1><section class="card"><h2>${t("近 7 天步数","Steps · last 7 days")}</h2><canvas id="chart" width="500" height="190"></canvas><div class="row muted"><span>${t("打卡完成率","Check-in rate")}</span><b>${completed}/7 (${Math.round(completed/7*100)}%)</b></div><div class="row muted"><span>${t("连续打卡","Current streak")}</span><b>${streak} ${t("天","days")}</b></div><p>${diff>=0?t(`较上周增加 ${diff.toLocaleString()} 步，继续保持！`,`Up ${diff.toLocaleString()} steps vs last week. Keep it up!`):t(`较上周减少 ${Math.abs(diff).toLocaleString()} 步，找时间活动一下吧。`,`Down ${Math.abs(diff).toLocaleString()} steps vs last week. Try to move a little more.`)}</p></section>`;
    drawChart(days,vals);
  } else {
    v.innerHTML=`<h1>${t("我的","Profile")}</h1><section class="card"><h2>${t("个人资料","Profile")}</h2>
      <div class="grid2"><label>${t("身高 (cm)","Height (cm)")}<input id="height" type="number" min="50" max="250" value="${esc(data.height)}"></label><label>${t("体重 (kg)","Weight (kg)")}<input id="weight" type="number" min="10" max="350" value="${esc(data.weight)}"></label></div>
      <p class="muted">${bmi()?`BMI ${bmi().toFixed(2)} · ${band()==="thin"?t("偏瘦","Lower range"):band()==="high"?t("偏胖","Higher range"):t("标准","Standard")}`:t("填写身高和体重后显示 BMI","Enter height and weight to calculate BMI")}</p></section>
      <section class="card"><h2>${t("目标与提醒","Goals & reminders")}</h2><div class="grid2"><label>${t("每日步数目标","Daily step goal")}<input id="goal" type="number" min="500" max="100000" value="${Number(data.goal)}"></label><label>${t("提醒时间","Reminder time")}<input id="reminder" type="time" value="${esc(data.reminder)}"></label></div>
      <p><label><span><input id="notify" type="checkbox" ${data.notify?"checked":""} style="width:auto"> ${t("达标时允许系统通知","Allow goal notifications")}</span></label></p></section>
      <section class="card"><h2>${t("语言与数据","Language & data")}</h2><div class="row"><span>${t("界面语言","Language")}</span><button class="secondary" id="lang">${data.lang==="zh"?"中文":"English"}</button></div><div class="spacer"></div><div class="row"><button class="secondary" id="export">${t("导出备份","Export backup")}</button><label style="display:block"><button class="secondary" type="button" onclick="document.getElementById('importFile').json,application/json" hidden></label></div></section>
      <p class="muted">${t("数据保存在此浏览器中。卸载或清除浏览器数据前，请先导出备份。","Data is stored in this browser. Export a backup before uninstalling or clearing browser data.")}</p>`;
    bindProfile();
  }
}
function drawChart(days,vals){
  let c=$("#chart");if(!c)return;let ctx=c.getContext("2d"),w=c.width,h=c.height,p=28,max=Math.max(1000,...vals);
  ctx.clearRect(0,0,w,h);ctx.strokeStyle="#e5e7eb";ctx.fillStyle="#667085";ctx.font="12px sans-serif";
  for(let i=0;i<4;i++){let y=p+(h-2*p)*i/3;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-p,y);ctx.stroke()}
  ctx.strokeStyle="#3b82f6";ctx.lineWidth=3;ctx.beginPath();
  vals.forEach((v,i)=>{let x=p+(w-2*p)*i/6,y=h-p-(h-2*p)*v/max;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.stroke();ctx.fillStyle="#3b82f6";
  vals.forEach((v,i)=>{let x=p+(w-2*p)*i/6,y=h-p-(h-2*p)*v/max;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()});
  ctx.fillStyle="#667085";days.forEach((d,i)=>{let x=p+(w-2*p)*i/6;ctx.fillText(d.slice(5),x-14,h-5)});
}
function bindProfile(){
  ["height","weight","goal","reminder"].forEach(id=>$("#"+id).addEventListener("change",e=>{
    data[id]=id==="height"||id==="weight"?e.target.value:id==="goal"?Math.max(500,Number(e.target.value)||8000):e.target.value;save();render();
  }));
  $("#notify").onchange=async e=>{if(e.target.checked&&"Notification"in window){let p=await Notification.requestPermission();data.notify=p==="granted"}else data.notify=false;save();render()};
  $("#lang").onclick=()=>{data.lang=data.lang==="zh"?"en":"zh";save();render()};
  $("#export").onclick=()=>{let blob=new Blob([JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`steps-and-gym-backup-${today().replaceAll("-","")}.json`;a.click();URL.revokeObjectURL(a.href)};
  $("#importFile").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(x.schemaVersion!==1||!x.data?.steps||!x.data?.custom)throw Error();if(confirm(t("导入将覆盖当前数据，确定继续吗？","Import will replace current data. Continue?"))){data=x.data;save();render()}}catch{alert(t("文件无效或版本不支持，现有数据未更改。","Invalid or unsupported file. Existing data was not changed."))}};
}
$("#tabs").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b){page=b.dataset.page;render()}});
$("#view").addEventListener("click",async e=>{
  let b=e.target.closest("[data-page]");if(b){page=b.dataset.page;render();return}
  if(e.target.id==="manual"){let n=prompt(t("请输入今天的总步数（将覆盖当前记录）","Enter today's total steps (replaces current value)"),String(count()));if(n!==null&&Number.isFinite(+n)&&+n>=0){data.steps[today()]={count:Math.floor(+n),manual:true,celebrated:data.steps[today()]?.celebrated||false};save();maybeCelebrate();render()}}
  if(e.target.id==="sensor"){if(sensorOn){window.removeEventListener("devicemotion",motion);sensorOn=false;render()}else startSensor()}
  if(e.target.id==="addTask"){let name=$("#taskName").value.trim();if(name){data.custom.push({id:"c"+Date.now(),name,meta:$("#taskMeta").value.trim()});save();render()}}
  if(e.target.id==="checkin"){if(tasks().length===doneList().length){data.checkins[today()]=true;save();alert(t("打卡完成，做得很好！","Check-in complete. Well done!"));render()}}
  let del=e.target.closest("[data-delete]");if(del&&confirm(t("删除这个个人任务？","Delete this custom task?"))){data.custom=data.custom.filter(x=>x.id!==del.dataset.delete);save();render()}
});
$("#view").addEventListener("change",e=>{if(e.target.matches("[data-task]")){let a=doneList(),id=e.target.dataset.task;data.done[today()]=e.target.checked?[...new Set([...a,id])]:a.filter(x=>x!==id);save();render()}});
async function startSensor(){
  if(!("DeviceMotionEvent"in window)){alert(t("此设备不支持运动传感器，请手动录入步数。","Motion sensor unavailable. Please enter steps manually."));return}
  try{if(typeof DeviceMotionEvent.requestPermission==="function"&&await DeviceMotionEvent.requestPermission()!=="granted")throw Error("denied");sensorOn=true;window.addEventListener("devicemotion",motion);render()}
  catch{sensorOn=false;alert(t("未获得传感器权限，请手动录入步数。","Sensor permission denied. Please enter steps manually."))}
}
function motion(e){
  let a=e.accelerationIncludingGravity;if(!a)return;let mag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2),now=Date.now();
  if(Math.abs(mag-9.8)>2.0&&now-lastPeak>350){lastPeak=now;let r=data.steps[today()]||{count:0,manual:false,celebrated:false};r.count++;data.steps[today()]=r;save();maybeCelebrate();render()}
}
checkReminder();render();
</script>
</body>
</html>
